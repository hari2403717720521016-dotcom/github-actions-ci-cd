name: CI - Build, Test and Publish Artifact

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

# Cancel older runs for the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Execute automated tests
      - name: Run tests
        run: npm test

      # 5. Compile/build the application
      - name: Build application
        run: npm run build

      # 6. Save the generated build files
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
